<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Cortex AI conversational agent interface preview</title>
  <desc id="desc">A dark conversational AI workspace with persistent threads, workspace modes, and a streamed response.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111526"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="900" fill="url(#background)"/>
  <rect x="44" y="42" width="1352" height="816" rx="24" fill="#171b2b" stroke="#313856" stroke-width="2"/>
  <rect x="44" y="42" width="300" height="816" rx="24" fill="#101321"/>
  <path d="M344 42v816" stroke="#313856" stroke-width="2"/>
  <text x="84" y="108" fill="#f3f4ff" font-family="Arial, sans-serif" font-size="32" font-weight="700">CORTEX</text>
  <text x="84" y="139" fill="#8f96b7" font-family="Arial, sans-serif" font-size="15" letter-spacing="3">AGENT WORKSPACE</text>
  <rect x="78" y="180" width="232" height="54" rx="12" fill="url(#accent)"/>
  <text x="106" y="214" fill="#fff" font-family="Arial, sans-serif" font-size="17" font-weight="700">+  New conversation</text>
  <text x="84" y="282" fill="#8991b4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">THREADS</text>
  <rect x="78" y="307" width="232" height="54" rx="10" fill="#252a43"/>
  <circle cx="101" cy="334" r="7" fill="#65e6c1"/>
  <text x="122" y="340" fill="#eef0ff" font-family="Arial, sans-serif" font-size="16">Product research</text>
  <text x="84" y="402" fill="#8991b4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2">WORKSPACES</text>
  <text x="84" y="445" fill="#cbd0ee" font-family="Arial, sans-serif" font-size="17">●  General Chat</text>
  <text x="84" y="487" fill="#8f96b7" font-family="Arial, sans-serif" font-size="17">◈  PDF / RAG</text>
  <text x="84" y="529" fill="#8f96b7" font-family="Arial, sans-serif" font-size="17">⌘  MCP Tools</text>
  <text x="406" y="116" fill="#f3f4ff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Cortex AI</text>
  <text x="406" y="148" fill="#8f96b7" font-family="Arial, sans-serif" font-size="16">Stateful conversations with LangGraph and Groq</text>
  <rect x="406" y="206" width="868" height="126" rx="16" fill="#22273c"/>
  <text x="438" y="246" fill="#aeb6dc" font-family="Arial, sans-serif" font-size="15">YOU</text>
  <text x="438" y="282" fill="#f4f5ff" font-family="Arial, sans-serif" font-size="22">Summarize the key ideas in this document.</text>
  <rect x="406" y="370" width="868" height="222" rx="16" fill="#1c3240"/>
  <text x="438" y="411" fill="#65e6c1" font-family="Arial, sans-serif" font-size="15">CORTEX AI  •  STREAMING</text>
  <text x="438" y="458" fill="#f4f5ff" font-family="Arial, sans-serif" font-size="21">Here are the main ideas I found:</text>
  <text x="438" y="502" fill="#cbd0ee" font-family="Arial, sans-serif" font-size="19">• The workflow keeps conversation state per thread.</text>
  <text x="438" y="539" fill="#cbd0ee" font-family="Arial, sans-serif" font-size="19">• Retrieval and tool modes extend the same chat surface.</text>
  <rect x="406" y="646" width="868" height="72" rx="14" fill="#111625" stroke="#38405e"/>
  <text x="438" y="690" fill="#7881a5" font-family="Arial, sans-serif" font-size="18">Ask Cortex anything...</text>
  <circle cx="1234" cy="682" r="22" fill="url(#accent)"/>
  <path d="m1226 682 8 8 13-16" fill="none" stroke="#fff" stroke-width="3"/>
</svg>
